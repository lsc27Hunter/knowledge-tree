<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/git_knowledgetree-icon.svg" />

    <!-- Set the home screen icon on iOS. https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/ConfiguringWebApplications/ConfiguringWebApplications.html -->
    <link rel="apple-touch-icon" href="/mobile-icon.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowledgeTree</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kt-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
