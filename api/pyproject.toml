[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cryptography>=49.0.0",
    "fastapi[standard]>=0.138.0",
    "httpx>=0.28.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "pywebpush>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.14.2",
]

# https://anyio.readthedocs.io/en/stable/testing.html#creating-asynchronous-tests
[tool.pytest.ini_options]
anyio_mode = "auto"
